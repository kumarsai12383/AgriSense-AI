<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>AgriSense Live Voice</title>

<style>

body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px;
    background: #f5f7f5;
}

h1 {
    font-size: 36px;
}

h2 {
    margin-bottom: 25px;
}

select {
    font-size: 18px;
    padding: 12px 18px;
    border-radius: 10px;
    margin-bottom: 25px;
}

button {
    font-size: 20px;
    padding: 15px 30px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    margin: 5px;
}

#start {
    background: #2e7d32;
    color: white;
}

#stop {
    background: #c62828;
    color: white;
}

#status {
    margin-top: 25px;
    font-size: 18px;
    font-weight: bold;
}

#transcript {
    margin: 25px auto;
    max-width: 600px;
    padding: 20px;
    background: white;
    border-radius: 12px;
    min-height: 80px;
    font-size: 18px;
}

</style>

</head>


<body>

<h1>🌱 AgriSense AI</h1>

<h2>🎤 Talk to AgriSense</h2>


<!-- Language -->

<select id="language">

    <option value="English">English</option>

    <option value="Telugu">తెలుగు</option>

    <option value="Hindi">हिंदी</option>

    <option value="Tamil">தமிழ்</option>

    <option value="Kannada">ಕನ್ನಡ</option>

    <option value="Marathi">मराठी</option>

</select>


<!-- Farmer ID is hidden.
     Current test farmer = ID 2 -->

<input
    id="farmerId"
    type="hidden"
    value="2"
/>


<br>


<button id="start">
    🎤 START
</button>


<button id="stop">
    ⏹ STOP
</button>


<div id="status">
    Ready
</div>


<div id="transcript">
    AI response will appear here.
</div>


<script>


let websocket = null;

let audioContext = null;

let microphone = null;

let processor = null;

let stream = null;

let playbackContext = null;

let nextPlayTime = 0;


const status =
    document.getElementById("status");


const transcript =
    document.getElementById("transcript");



function updateStatus(text) {

    status.innerText = text;

}



/* =========================
   AUDIO DOWNSAMPLING
========================= */

function downsample(
    input,
    inputRate,
    outputRate
) {

    if (inputRate === outputRate) {

        return input;

    }


    const ratio =
        inputRate / outputRate;


    const newLength =
        Math.round(
            input.length / ratio
        );


    const result =
        new Float32Array(
            newLength
        );


    let offset = 0;


    for (
        let i = 0;
        i < newLength;
        i++
    ) {

        const nextOffset =
            Math.round(
                (i + 1) * ratio
            );


        let sum = 0;

        let count = 0;


        for (
            let j = offset;
            j < nextOffset &&
            j < input.length;
            j++
        ) {

            sum += input[j];

            count++;

        }


        result[i] =
            count > 0
                ? sum / count
                : 0;


        offset = nextOffset;

    }


    return result;

}



/* =========================
   FLOAT → PCM16
========================= */

function floatToPCM16(float32) {

    const buffer =
        new ArrayBuffer(
            float32.length * 2
        );


    const view =
        new DataView(buffer);


    for (
        let i = 0;
        i < float32.length;
        i++
    ) {

        let sample =
            Math.max(
                -1,
                Math.min(
                    1,
                    float32[i]
                )
            );


        view.setInt16(
            i * 2,

            sample < 0
                ? sample * 0x8000
                : sample * 0x7fff,

            true
        );

    }


    return buffer;

}



/* =========================
   PLAY GEMINI AUDIO
========================= */

function playPCM16(
    arrayBuffer,
    sampleRate
) {

    if (!playbackContext) {

        return;

    }


    const int16 =
        new Int16Array(
            arrayBuffer
        );


    const float32 =
        new Float32Array(
            int16.length
        );


    for (
        let i = 0;
        i < int16.length;
        i++
    ) {

        float32[i] =
            int16[i] / 32768;

    }


    const buffer =
        playbackContext.createBuffer(
            1,
            float32.length,
            sampleRate
        );


    buffer.copyToChannel(
        float32,
        0
    );


    const source =
        playbackContext.createBufferSource();


    source.buffer = buffer;


    source.connect(
        playbackContext.destination
    );


    const now =
        playbackContext.currentTime;


    if (nextPlayTime < now) {

        nextPlayTime = now;

    }


    source.start(
        nextPlayTime
    );


    nextPlayTime +=
        buffer.duration;

}



/* =========================
   START VOICE
========================= */

async function startVoice() {

    updateStatus(
        "🔌 Connecting to AgriSense..."
    );


    const selectedLanguage =
        document
            .getElementById("language")
            .value;


    const farmerId =
        document
            .getElementById("farmerId")
            .value;


    const websocketURL =
        "ws://localhost:8000/live"
        + "?language="
        + encodeURIComponent(
            selectedLanguage
        )
        + "&farmer_id="
        + encodeURIComponent(
            farmerId
        );


    websocket =
        new WebSocket(
            websocketURL
        );


    websocket.binaryType =
        "arraybuffer";


    /* =========================
       WEBSOCKET CONNECTED
    ========================= */

    websocket.onopen =
        async function() {

            updateStatus(
                "🎤 Connected — speak now"
            );


            try {

                stream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({
                            audio: {
                                channelCount: 1,
                                echoCancellation: true,
                                noiseSuppression: true,
                                autoGainControl: true
                            }
                        });


                audioContext =
                    new AudioContext();


                playbackContext =
                    new AudioContext();


                await audioContext.resume();


                await playbackContext.resume();


                microphone =
                    audioContext
                        .createMediaStreamSource(
                            stream
                        );


                processor =
                    audioContext
                        .createScriptProcessor(
                            4096,
                            1,
                            1
                        );


                processor.onaudioprocess =
                    function(event) {

                        if (
                            !websocket ||
                            websocket.readyState !==
                                WebSocket.OPEN
                        ) {

                            return;

                        }


                        const input =
                            event
                                .inputBuffer
                                .getChannelData(0);


                        const downsampled =
                            downsample(
                                input,
                                audioContext.sampleRate,
                                16000
                            );


                        const pcm =
                            floatToPCM16(
                                downsampled
                            );


                        websocket.send(
                            pcm
                        );

                    };


                microphone.connect(
                    processor
                );


                processor.connect(
                    audioContext.destination
                );


                updateStatus(
                    "🎤 Listening... Speak now"
                );

            }

            catch (error) {

                console.error(error);

                updateStatus(
                    "❌ Microphone permission failed"
                );

            }

        };



    /* =========================
       GEMINI RESPONSE
    ========================= */

    websocket.onmessage =
        function(event) {


            /* AI TEXT */

            if (
                typeof event.data ===
                "string"
            ) {


                if (
                    event.data.startsWith(
                        "AI:"
                    )
                ) {

                    transcript.innerText =
                        event.data.substring(3);

                }


                if (
                    event.data.startsWith(
                        "ERROR:"
                    )
                ) {

                    updateStatus(
                        "❌ "
                        + event.data.substring(6)
                    );

                }


                return;

            }


            /* AI AUDIO */

            playPCM16(
                event.data,
                24000
            );

        };



    websocket.onerror =
        function(error) {
            console.error(
                "WebSocket error:",
                error
            );
            updateStatus(
                "❌ Connection error (Ensure 'python server.py' is running on port 8000)"
            );
        };

    websocket.onclose =
        function(event) {
            console.log("WebSocket closed:", event.code, event.reason);
            if (event.code === 1000) {
                updateStatus("⏹ Session ended");
            } else if (event.code === 1005 || event.code === 1006) {
                updateStatus("❌ Disconnected: WebSocket Server is offline (Port 8000)");
            } else {
                updateStatus("⏹ Disconnected (" + event.code + ")");
            }
        };

}



/* =========================
   STOP VOICE
========================= */

function stopVoice() {


    if (processor) {

        processor.disconnect();

        processor = null;

    }


    if (microphone) {

        microphone.disconnect();

        microphone = null;

    }


    if (stream) {

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        stream = null;

    }


    if (audioContext) {

        audioContext.close();

        audioContext = null;

    }


    if (playbackContext) {

        playbackContext.close();

        playbackContext = null;

    }


    nextPlayTime = 0;


    if (websocket) {

        websocket.close();

        websocket = null;

    }


    updateStatus(
        "⏹ Stopped"
    );

}



/* =========================
   BUTTONS
========================= */

document
    .getElementById("start")
    .onclick = startVoice;


document
    .getElementById("stop")
    .onclick = stopVoice;


</script>

</body>

</html>
